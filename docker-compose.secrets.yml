# Credentials from files instead of environment variables.
#
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# Every secret is a file whose NAME is the config key, with "__" where the key
# has a ":". Docker mounts them at /run/secrets/<name>, and the app reads that
# directory via AddKeyPerFile in Program.cs. Credentials never appear in the
# compose file, in `docker inspect`, or in the process environment.
#
# Create the files first:
#
#   mkdir -p secrets && chmod 700 secrets
#   printf '%s' 'Host=db;Port=5432;Database=rmv;Username=rmv;Password=REAL' \
#     > secrets/ConnectionStrings__Postgres
#   printf '%s' 'REAL'   > secrets/postgres_password
#   printf '%s' 'ID'     > secrets/Discord__ClientId
#   printf '%s' 'SECRET' > secrets/Discord__ClientSecret
#   chmod 600 secrets/*
#
# A trailing newline is harmless: .NET's KeyPerFile provider and the Postgres
# entrypoint both strip trailing whitespace, tested both ways. printf is used
# above only so the files hold exactly what was intended.
#
# Swarm or an external secrets manager: replace each `file:` with
# `external: true` and create the secrets out of band. Nothing else changes.

services:
  db:
    environment:
      # The image refuses to start if both POSTGRES_PASSWORD and
      # POSTGRES_PASSWORD_FILE are set, so the env-var form is removed. Note
      # `!reset null` and not a bare `POSTGRES_PASSWORD:`, which Compose reads as
      # "inherit from the host environment" rather than "unset".
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  web:
    environment:
      # Removed so the mounted secret is the only source and a stale value
      # cannot linger in the process environment.
      ConnectionStrings__Postgres: !reset null
      Discord__ClientId: !reset null
      Discord__ClientSecret: !reset null
    secrets:
      - ConnectionStrings__Postgres
      - Discord__ClientId
      - Discord__ClientSecret

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  ConnectionStrings__Postgres:
    file: ./secrets/ConnectionStrings__Postgres
  Discord__ClientId:
    file: ./secrets/Discord__ClientId
  Discord__ClientSecret:
    file: ./secrets/Discord__ClientSecret
