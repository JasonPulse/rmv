# Local development only. Production runs on Kubernetes; see deploy/k8s.
#
#   docker compose up -d db          Postgres for `dotnet watch`
#   docker compose up -d --build     the whole app in a container, on :5080
#
# Needs POSTGRES_PASSWORD=rmv in .env to match appsettings.Development.json.
name: rmv-dev

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rmv}
      POSTGRES_USER: ${POSTGRES_USER:-rmv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Loopback only, so Rider and dotnet watch can reach it.
      - "127.0.0.1:5432:5432"
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data. Postgres 18 images put
      # the cluster in a major-version subdirectory, and mounting the old path
      # makes the container refuse to start.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rmv} -d ${POSTGRES_DB:-rmv}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: .
      args:
        BUILD_VERSION: ${BUILD_VERSION:-local}
    image: ${WEB_IMAGE:-rmv-web:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-rmv};Username=${POSTGRES_USER:-rmv};Password=${POSTGRES_PASSWORD}
      # Root admins, comma separated. They cannot be revoked from inside the app and
      # they work when the database is unreachable, which is what stops a bad grant
      # or an outage locking you out. Matches the deployment.
      Admin__DiscordIds: ${ADMIN_DISCORD_IDS:-}
      Discord__ClientId: ${DISCORD_CLIENT_ID:-}
      Discord__ClientSecret: ${DISCORD_CLIENT_SECRET:-}
      # Operator level, not admin level. The FFXI herald resolves to an RFC1918
      # address, so the SSRF guard refuses it unless it is named here. Needed for
      # its portraits as much as its API. Matches the deployment.
      Herald__AllowedPrivateHosts: ${HERALD_ALLOWED_PRIVATE_HOSTS:-}
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - ./content:/app/content:ro

volumes:
  pgdata:
