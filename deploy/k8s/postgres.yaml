apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  clusterIP: None            # headless; the StatefulSet addresses db-0 directly
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        # 70 is postgres:postgres in the alpine image. The Debian variant uses
        # 999; getting this from the wrong variant is an easy mistake. Verified
        # against the image.
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: rmv
            - name: POSTGRES_USER
              value: rmv
            # Read from a file rather than a plain env var, so the password is
            # not visible in `kubectl describe pod` or to anything reading the
            # process environment.
            - name: POSTGRES_PASSWORD_FILE
              value: /etc/postgres-secret/password
            # The image puts the cluster in a major-version subdirectory of the
            # mount. Set explicitly because the volume is a subPath.
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: secret
              mountPath: /etc/postgres-secret
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "rmv", "-d", "rmv"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "rmv", "-d", "rmv"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: secret
          secret:
            secretName: rmv-postgres
            # 0440 rather than 0400 only so this still works if anyone later
            # sets runAsUser on this pod. As it stands the entrypoint reads the
            # file while still root and then drops to uid 70, so the mode does
            # not currently matter here. It very much does for the web pod.
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
