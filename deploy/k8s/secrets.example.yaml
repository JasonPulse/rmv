# The exact secret names and keys the manifests expect. Do NOT apply this file
# with these values, and do not commit real ones. Create them with kubectl, or
# feed the same key names through sealed-secrets, external-secrets or SOPS.
#
# The key NAMES in rmv-app matter: each becomes a file under /run/secrets, and
# the app maps the filename to a config key, turning "__" into ":". So
# ConnectionStrings__Postgres sets ConnectionStrings:Postgres.
#
#   kubectl -n rmv create secret generic rmv-postgres \
#     --from-literal=password='REAL'
#
#   kubectl -n rmv create secret generic rmv-app \
#     --from-literal=ConnectionStrings__Postgres='Host=db;Port=5432;Database=rmv;Username=rmv;Password=REAL' \
#     --from-literal=Discord__ClientId='ID' \
#     --from-literal=Discord__ClientSecret='SECRET'
#
#   kubectl -n rmv create secret generic rmv-cloudflared \
#     --from-literal=token='TUNNEL_TOKEN'
#
# The password inside ConnectionStrings__Postgres must match rmv-postgres/password.
# They are two secrets holding the same credential; nothing interpolates between
# them.
---
apiVersion: v1
kind: Secret
metadata:
  name: rmv-postgres
  namespace: rmv
stringData:
  password: CHANGE-ME
---
apiVersion: v1
kind: Secret
metadata:
  name: rmv-app
  namespace: rmv
stringData:
  # Optional. Omit the key and the site runs, reporting the database as not
  # configured. Sign-in then also stays off, since the key ring needs Postgres.
  ConnectionStrings__Postgres: Host=db;Port=5432;Database=rmv;Username=rmv;Password=CHANGE-ME
  # Both must be non-empty for sign-in to appear. Omit both to leave it off.
  Discord__ClientId: ""
  Discord__ClientSecret: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: rmv-cloudflared
  namespace: rmv
stringData:
  token: CHANGE-ME
