# The exact secret names and keys the manifests expect. Do NOT apply this file
# with these values, and do not commit real ones. Create them with kubectl, or
# feed the same key names through sealed-secrets, external-secrets or SOPS.
#
# The key NAMES in rmv-app matter: each becomes a file under /run/secrets, and
# the app maps the filename to a config key, turning "__" into ":". So
# ConnectionStrings__Postgres sets ConnectionStrings:Postgres.
#
#   kubectl -n rmv create secret generic rmv-app \
#     --from-literal=ConnectionStrings__Postgres='Host=HOST;Port=5432;Database=DB;Username=USER;Password=PW;Maximum Pool Size=10' \
#     --from-literal=Discord__ClientId='ID' \
#     --from-literal=Discord__ClientSecret='SECRET'
#
#   kubectl -n rmv create secret generic rmv-cloudflared \
#     --from-literal=token='TUNNEL_TOKEN'
---
apiVersion: v1
kind: Secret
metadata:
  name: rmv-app
  namespace: rmv
stringData:
  # Points at the existing Postgres instance. Optional: omit the key and the site
  # runs, reporting the database as not configured. Sign-in also stays off in
  # that case, since the Data Protection key ring needs Postgres.
  #
  # Maximum Pool Size is worth setting explicitly. Npgsql defaults to 100 per
  # process, so two replicas can open 200 connections against a shared instance.
  ConnectionStrings__Postgres: Host=CHANGE-ME;Port=5432;Database=rmv;Username=rmv;Password=CHANGE-ME;Maximum Pool Size=10
  # Both must be non-empty for sign-in to appear. Omit both to leave it off.
  Discord__ClientId: ""
  Discord__ClientSecret: ""

  # Hosts the SSRF guard is permitted to reach on a private address. Comma
  # separated. Operator level rather than admin level on purpose: a web admin can
  # point a game at any public herald, but only whoever controls the deployment
  # can permit an internal one.
  #
  # The FFXI herald needs this. It resolves to an RFC1918 address, so without it
  # both its API and its character portraits are refused.
  #
  #   Herald__AllowedPrivateHosts: "heraldxi.network-gnomes.com"
  Herald__AllowedPrivateHosts: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: rmv-cloudflared
  namespace: rmv
stringData:
  token: CHANGE-ME
