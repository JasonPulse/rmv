apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  # Two replicas so a rollout or node drain does not drop the tunnel. Cloudflare
  # load-balances across all connectors registered for the same tunnel.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            # cloudflared has no file-based option for the token, so this one
            # credential does reach the process environment. It is still stored
            # as a Secret. Use a credentials-file tunnel instead if that matters.
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rmv-cloudflared
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
