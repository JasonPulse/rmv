apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rmv

commonLabels:
  app.kubernetes.io/part-of: results-may-vary

resources:
  - namespace.yaml
  - web.yaml
  - cloudflared.yaml

# No Postgres here: the cluster already has an instance. The app reaches it
# through the connection string in the rmv-app secret. See docs/deploy.md for
# what it needs from that instance.

# Secrets are deliberately not here. Create them out of band, or point this at
# whatever seals them (sealed-secrets, external-secrets, SOPS). See
# secrets.example.yaml for the exact key names.
